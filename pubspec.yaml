name: atem
description: ATEM Hybrid — Strength, Cardio & Recovery.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  google_sign_in: ^7.2.0
  intl: any
  meta: ^1.16.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_lint: ^3.1.8
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
  generate: true

  # Schriften werden gebündelt, nicht zur Laufzeit geladen. Ohne das fällt
  # die App beim ersten Start ohne Netz auf Systemschriften zurück — und
  # jeder Test, der eine Textrolle anfasst, scheitert am Verbindungsfehler.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
